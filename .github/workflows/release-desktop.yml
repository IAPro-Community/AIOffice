name: AIOffice Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aioffice-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source and release version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Validate release tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version" -or $env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag $env:GITHUB_REF_NAME must be a stable v$version tag matching package.json."
          }
      - run: npm ci
      - name: Verify application and desktop shell
        run: npm run desktop:verify

  package:
    name: Package ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            label: Windows x64
            os: windows-latest
          - id: linux-x64
            label: Linux x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        if: matrix.id == 'windows-x64'
        with:
          go-version: '1.22.x'
      - run: npm ci

      - name: Configure optional Windows code signing
        if: matrix.id == 'windows-x64'
        shell: pwsh
        env:
          WIN_CERTIFICATE_BASE64: ${{ secrets.AIOFFICE_WINDOWS_CERTIFICATE_BASE64 }}
          WIN_CERTIFICATE_PASSWORD: ${{ secrets.AIOFFICE_WINDOWS_CERTIFICATE_PASSWORD }}
          WIN_CERTIFICATE_PUBLISHER: ${{ vars.AIOFFICE_WINDOWS_PUBLISHER_NAME }}
        run: |
          $provided = @($env:WIN_CERTIFICATE_BASE64, $env:WIN_CERTIFICATE_PASSWORD, $env:WIN_CERTIFICATE_PUBLISHER) | Where-Object { $_ }
          if ($provided.Count -eq 0) {
            Write-Host 'Authenticode signing is not configured. The updater verifies GitHub release SHA-256 before opening the installer.'
            exit 0
          }
          if ($provided.Count -ne 3) {
            throw 'Configure AIOFFICE_WINDOWS_CERTIFICATE_BASE64, AIOFFICE_WINDOWS_CERTIFICATE_PASSWORD, and AIOFFICE_WINDOWS_PUBLISHER_NAME together.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'aioffice-windows-signing.p12'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WIN_CERTIFICATE_BASE64))
          "CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CSC_KEY_PASSWORD=$env:WIN_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AIOFFICE_WINDOWS_PUBLISHER_NAME=$env:WIN_CERTIFICATE_PUBLISHER" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'AIOFFICE_REQUIRE_SIGNING=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Require Apple signing and notarization
        if: matrix.id == 'macos-arm64' || matrix.id == 'macos-x64'
        shell: bash
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.AIOFFICE_MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.AIOFFICE_MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.AIOFFICE_APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.AIOFFICE_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.AIOFFICE_APPLE_API_ISSUER }}
        run: |
          provided=0
          for value in "$MAC_CERTIFICATE_BASE64" "$MAC_CERTIFICATE_PASSWORD" "$APPLE_API_KEY_P8_BASE64" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; do
            if [[ -n "$value" ]]; then provided=$((provided + 1)); fi
          done
          if [[ "$provided" -eq 0 ]]; then
            echo 'Cannot publish macOS installers without Apple Developer ID signing and notarization. Configure AIOFFICE_MAC_CERTIFICATE_BASE64, AIOFFICE_MAC_CERTIFICATE_PASSWORD, AIOFFICE_APPLE_API_KEY_P8_BASE64, AIOFFICE_APPLE_API_KEY_ID, and AIOFFICE_APPLE_API_ISSUER first.' >&2
            exit 1
          fi
          if [[ "$provided" -ne 5 ]]; then
            echo 'Configure all five Apple signing secrets together; partial signing configuration is not supported.' >&2
            exit 1
          fi
          certificate_path="$RUNNER_TEMP/aioffice-macos-signing.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          CERTIFICATE_PATH="$certificate_path" MAC_CERTIFICATE_BASE64="$MAC_CERTIFICATE_BASE64" node -e 'require("node:fs").writeFileSync(process.env.CERTIFICATE_PATH, Buffer.from(process.env.MAC_CERTIFICATE_BASE64, "base64"))'
          API_KEY_PATH="$api_key_path" APPLE_API_KEY_P8_BASE64="$APPLE_API_KEY_P8_BASE64" node -e 'require("node:fs").writeFileSync(process.env.API_KEY_PATH, Buffer.from(process.env.APPLE_API_KEY_P8_BASE64, "base64"))'
          {
            echo "CSC_LINK=$certificate_path"
            echo "CSC_KEY_PASSWORD=$MAC_CERTIFICATE_PASSWORD"
            echo "APPLE_API_KEY=$api_key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo 'AIOFFICE_REQUIRE_SIGNING=1'
          } >> "$GITHUB_ENV"

      - name: Build Windows x64 installers
        if: matrix.id == 'windows-x64'
        run: npm run desktop:package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build macOS Apple silicon installers
        if: matrix.id == 'macos-arm64'
        run: npm run desktop:package:mac:arm64
      - name: Verify signed and notarized macOS assets
        if: matrix.id == 'macos-arm64'
        run: bash scripts/verify-macos-release.sh dist/installers/AIOffice-Setup-macOS-arm64.dmg dist/installers/AIOffice-Setup-macOS-arm64.zip
      - name: Build macOS Intel installers
        if: matrix.id == 'macos-x64'
        run: npm run desktop:package:mac:x64
      - name: Verify signed and notarized macOS assets
        if: matrix.id == 'macos-x64'
        run: bash scripts/verify-macos-release.sh dist/installers/AIOffice-Setup-macOS-x64.dmg dist/installers/AIOffice-Setup-macOS-x64.zip
      - name: Build Linux x64 installers
        if: matrix.id == 'linux-x64'
        run: npm run desktop:package:linux

      - name: Validate and stage Windows assets
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE 'dist/installers/AIOffice-Setup.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Windows installer is missing: $installer" }
          New-Item -ItemType Directory -Path 'dist/release-assets' -Force | Out-Null
          Copy-Item -LiteralPath $installer -Destination 'dist/release-assets/AIOffice-Setup.exe'
      - name: Package and verify Chrome extension ZIP
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: ./apps/office-chrome-extension/package-extension.ps1 -OutputPath dist/release-assets/AIOffice-Chrome-Extension.zip
      - name: Validate macOS assets
        if: matrix.id == 'macos-arm64'
        run: |
          test -s dist/installers/AIOffice-Setup-macOS-arm64.dmg
          test -s dist/installers/AIOffice-Setup-macOS-arm64.zip
          mkdir -p dist/release-assets
          cp dist/installers/AIOffice-Setup-macOS-arm64.dmg dist/installers/AIOffice-Setup-macOS-arm64.zip dist/release-assets/
      - name: Validate macOS assets
        if: matrix.id == 'macos-x64'
        run: |
          test -s dist/installers/AIOffice-Setup-macOS-x64.dmg
          test -s dist/installers/AIOffice-Setup-macOS-x64.zip
          mkdir -p dist/release-assets
          cp dist/installers/AIOffice-Setup-macOS-x64.dmg dist/installers/AIOffice-Setup-macOS-x64.zip dist/release-assets/
      - name: Validate Linux assets
        if: matrix.id == 'linux-x64'
        run: |
          ls -lh dist/installers
          test -s dist/installers/AIOffice-Setup-Linux-x64.AppImage
          test -s dist/installers/AIOffice-Setup-Linux-x64.deb
          mkdir -p dist/release-assets
          cp dist/installers/AIOffice-Setup-Linux-x64.AppImage dist/installers/AIOffice-Setup-Linux-x64.deb dist/release-assets/

      - name: Build unpacked app for packaged runtime smoke
        run: npm run desktop:build
      - name: Smoke test packaged Windows app
        if: matrix.id == 'windows-x64'
        run: node scripts/desktop-smoke.mjs windows
      - name: Smoke test packaged macOS app
        if: matrix.id == 'macos-arm64' || matrix.id == 'macos-x64'
        run: node scripts/desktop-smoke.mjs macos
      - name: Smoke test packaged Linux app
        if: matrix.id == 'linux-x64'
        run: xvfb-run -a node scripts/desktop-smoke.mjs linux

      - name: Upload Windows assets
        if: matrix.id == 'windows-x64'
        uses: actions/upload-artifact@v7
        with:
          name: aioffice-installers-windows-x64
          path: |
            dist/release-assets/AIOffice-Setup.exe
            dist/release-assets/AIOffice-Chrome-Extension.zip
          if-no-files-found: error
      - name: Upload macOS Apple silicon assets
        if: matrix.id == 'macos-arm64'
        uses: actions/upload-artifact@v7
        with:
          name: aioffice-installers-macos-arm64
          path: |
            dist/release-assets/AIOffice-Setup-macOS-arm64.dmg
            dist/release-assets/AIOffice-Setup-macOS-arm64.zip
          if-no-files-found: error
      - name: Upload macOS Intel assets
        if: matrix.id == 'macos-x64'
        uses: actions/upload-artifact@v7
        with:
          name: aioffice-installers-macos-x64
          path: |
            dist/release-assets/AIOffice-Setup-macOS-x64.dmg
            dist/release-assets/AIOffice-Setup-macOS-x64.zip
          if-no-files-found: error
      - name: Upload Linux assets
        if: matrix.id == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: aioffice-installers-linux-x64
          path: |
            dist/release-assets/AIOffice-Setup-Linux-x64.AppImage
            dist/release-assets/AIOffice-Setup-Linux-x64.deb
          if-no-files-found: error

  publish:
    name: Assemble and verify assets; publish only on a release tag
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: aioffice-installers-*
          path: dist/release-assets
          merge-multiple: true
      - name: Generate native update manifests
        run: node scripts/create-desktop-update-manifests.mjs --linux-only
      - name: Validate complete release asset set
        shell: bash
        run: |
          for asset in \
            AIOffice-Setup.exe \
            AIOffice-Setup-Linux-x64.AppImage AIOffice-Setup-Linux-x64.deb \
            latest-linux.yml AIOffice-Chrome-Extension.zip; do
            test -s "dist/release-assets/$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
      - name: Generate release notes
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="$(node -p "require('./package.json').version")"
          fi
          RELEASE_VERSION="$release_version" RELEASE_NOTES_PATH="$RUNNER_TEMP/release-notes.md" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { changelogSection } from "./scripts/release-aioffice.mjs";
            writeFileSync(process.env.RELEASE_NOTES_PATH, changelogSection(readFileSync("CHANGELOG.md", "utf8"), process.env.RELEASE_VERSION) + "\n", "utf8");
          '
      - name: Create or reuse an unpublished draft
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-is-draft" 2>/dev/null; then
            if [[ "$(cat "$RUNNER_TEMP/release-is-draft")" != true ]]; then
              echo "Refusing to overwrite an already published release: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --title "AIOffice $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "AIOffice $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Upload release assets to the draft
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/release-assets/* --clobber

      - name: Verify uploaded names, sizes, and SHA-256 digests before publication
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected_names=$(printf '%s\n' \
            AIOffice-Setup.exe \
            AIOffice-Setup-Linux-x64.AppImage AIOffice-Setup-Linux-x64.deb \
            latest-linux.yml AIOffice-Chrome-Extension.zip | sort)
          actual_names=$(find dist/release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "$actual_names" != "$expected_names" ]]; then
            echo 'Local release asset names do not match the stable release contract.' >&2
            diff -u <(printf '%s\n' "$expected_names") <(printf '%s\n' "$actual_names") || true
            exit 1
          fi

          # Draft releases are omitted from GitHub's release-by-tag endpoint. List the
          # releases and select the tag so the draft created above remains verifiable.
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -c --arg tag "$GITHUB_REF_NAME" '[.[] | select(.tag_name == $tag)][0] // empty')
          if [[ -z "$release_json" ]]; then
            echo "Could not find the draft release $GITHUB_REF_NAME in the release list." >&2
            exit 1
          fi
          if [[ "$(jq -r '.draft' <<<"$release_json")" != true ]]; then
            echo 'Release stopped being a draft before asset verification.' >&2
            exit 1
          fi
          remote_names=$(jq -r '.assets[].name' <<<"$release_json" | sort)
          if [[ "$remote_names" != "$expected_names" ]]; then
            echo 'Uploaded GitHub asset names do not exactly match the release contract.' >&2
            diff -u <(printf '%s\n' "$expected_names") <(printf '%s\n' "$remote_names") || true
            exit 1
          fi

          while IFS= read -r file; do
            name=${file##*/}
            local_size=$(stat -c '%s' "$file")
            local_sha=$(sha256sum "$file" | cut -d ' ' -f 1)
            remote_size=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .size' <<<"$release_json")
            remote_digest=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // empty' <<<"$release_json")
            if [[ "$local_size" != "$remote_size" || "$remote_digest" != "sha256:$local_sha" ]]; then
              echo "GitHub size or SHA-256 does not match local asset $name" >&2
              exit 1
            fi
          done < <(find dist/release-assets -maxdepth 1 -type f | sort)

      - name: Publish verified release as latest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
